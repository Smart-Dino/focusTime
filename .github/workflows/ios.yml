name: Weekly App Version Bump

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump MARKETING_VERSION in project.pbxproj
        run: |
          FILE=$(find . -name "project.pbxproj")
          echo "Editing $FILE"

          CURRENT=$(grep -m1 "MARKETING_VERSION =" "$FILE" | sed -E 's/.*MARKETING_VERSION = ([0-9.]+);/\1/')
          echo "Current version: $CURRENT"

          if [[ ! $CURRENT =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Unexpected version format: $CURRENT"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEXT="$major.$minor.$((patch+1))"

          # Replace all MARKETING_VERSION occurrences
          sed -i '' -E "s/(MARKETING_VERSION = )$CURRENT;/\1$NEXT;/g" "$FILE"

          echo "✅ Updated MARKETING_VERSION: $CURRENT → $NEXT"
          echo "NEXT=$NEXT" >> $GITHUB_ENV

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: bump app version to $NEXT [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: git push origin HEAD:main
