name: Weekly App Version Bump

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Bump app version
        run: |
          CURRENT=$(agvtool what-marketing-version -terse1 | tail -1)
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEXT="$major.$minor.$((patch+1))"

          agvtool new-marketing-version $NEXT
          echo "Bumped version from $CURRENT to $NEXT"
          echo "NEXT=$NEXT" >> $GITHUB_ENV

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: bump app version to $NEXT [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push origin HEAD:main
