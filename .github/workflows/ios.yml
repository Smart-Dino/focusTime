name: Weekly Build Number Bump

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Bump build number for all targets
        run: |
          CURRENT=$(agvtool what-version -terse | tail -1)
          NEXT=$((CURRENT+1))
          agvtool new-version -all $NEXT
          echo "Bumped build number from $CURRENT to $NEXT for all targets"
          echo "NEXT=$NEXT" >> $GITHUB_ENV

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "chore: bump build number to $NEXT [skip ci]" || echo "No changes to commit"
          git push origin main
