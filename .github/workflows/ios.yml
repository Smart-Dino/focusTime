name: Weekly App Version Bump

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and bump versions
        run: |
          NEXT=""
          for plist in $(find . -name "Info.plist"); do
            CURRENT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$plist" 2>/dev/null || true)

            if [ -z "$CURRENT" ]; then
              echo "⚠️ Skipping $plist (no CFBundleShortVersionString)"
              continue
            fi

            echo "Found $plist → $CURRENT"

            # Support x.y or x.y.z
            PARTS=(${CURRENT//./ })
            major=${PARTS[0]}
            minor=${PARTS[1]:-0}
            patch=${PARTS[2]:-0}

            NEW="$major.$minor.$((patch+1))"

            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEW" "$plist"
            echo "Updated $plist → $NEW"

            NEXT=$NEW
          done

          if [ -z "$NEXT" ]; then
            echo "❌ No versions updated"
            exit 1
          fi

          echo "NEXT=$NEXT" >> $GITHUB_ENV

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: bump app version to $NEXT [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: git push origin HEAD:main
