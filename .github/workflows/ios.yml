name: Weekly App Version Bump

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Bump app version (patch)
        run: |
          # Read current version, strip whitespace
          CURRENT=$(agvtool what-marketing-version -terse1 | xargs)
          echo "Current version: $CURRENT"

          # Validate format
          if [[ ! $CURRENT =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Unexpected version format: $CURRENT"
            exit 1
          fi

          # Split into major.minor.patch
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEXT="$major.$minor.$((patch+1))"

          # Apply new version to all targets
          agvtool new-marketing-version $NEXT
          echo "✅ Bumped version from $CURRENT to $NEXT"

          # Save for commit message
          echo "NEXT=$NEXT" >> $GITHUB_ENV

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: bump app version to $NEXT [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push origin HEAD:main
